name: Reusable test workflow

on:
  workflow_call:
    inputs:
      DB_TO_TEST:
        required: true
        type: string
      SIMPLIFIED_TEST:
        required: true
        type: string
    secrets:
      CDM5_SQL_SERVER_PASSWORD:
        required: false
      CDM5_SQL_SERVER_SERVER:
        required: false
      CDM5_SQL_SERVER_USER:
        required: false
      CDM5_REDSHIFT_SERVER:
        required: false
      CDM5_REDSHIFT_PASSWORD:
        required: false
      CDM5_REDSHIFT_USER:
        required: false
      CDM5_POSTGRESQL_SERVER:
        required: false
      CDM5_POSTGRESQL_PASSWORD:
        required: false
      CDM5_POSTGRESQL_USER:
        required: false
      CDM_SNOWFLAKE_CONNECTION_STRING:
        required: false
      CDM_SNOWFLAKE_PASSWORD:
        required: false
      CDM_SNOWFLAKE_USER:
        required: false

jobs:
  run-tests:
    runs-on: ubuntu-latest

    env:
      DB_TO_TEST: ${{ inputs.DB_TO_TEST }}
      SIMPLIFIED_TEST: ${{ inputs.SIMPLIFIED_TEST }}
      CDM_SNOWFLAKE_CONNECTION_STRING: ${{ secrets.CDM_SNOWFLAKE_CONNECTION_STRING }}
      CDM_SNOWFLAKE_PASSWORD: ${{ secrets.CDM_SNOWFLAKE_PASSWORD }}
      CDM_SNOWFLAKE_USER: ${{ secrets.CDM_SNOWFLAKE_USER }}
      CDM5_POSTGRESQL_PASSWORD: ${{ secrets.CDM5_POSTGRESQL_PASSWORD }}
      CDM5_POSTGRESQL_SERVER: ${{ secrets.CDM5_POSTGRESQL_SERVER }}
      CDM5_POSTGRESQL_USER: ${{ secrets.CDM5_POSTGRESQL_USER }}
      CDM5_REDSHIFT_SERVER: ${{ secrets.CDM5_REDSHIFT_SERVER }}
      CDM5_REDSHIFT_PASSWORD: ${{ secrets.CDM5_REDSHIFT_PASSWORD }}
      CDM5_REDSHIFT_USER: ${{ secrets.CDM5_REDSHIFT_USER }}
      CDM5_SQL_SERVER_PASSWORD: ${{ secrets.CDM5_SQL_SERVER_PASSWORD }}
      CDM5_SQL_SERVER_SERVER: ${{ secrets.CDM5_SQL_SERVER_SERVER }}
      CDM5_SQL_SERVER_USER: ${{ secrets.CDM5_SQL_SERVER_USER }}

    strategy:
      fail-fast: true
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'release'}

    steps:
      - uses: actions/checkout@v2

      - uses: Yarden-zamir/install-mssql-odbc@main
        with:
          ODBC_VERSION: 18

      - name: Install Snowflake ODBC (Ubuntu)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl unixodbc unixodbc-dev odbcinst libodbc1 libodbcinst2

          # Pin a specific driver version so the CI environment is reproducible.
          VER=3.11.0
          curl --fail --silent --show-error --location \
            --output snowflake-odbc.deb \
            "https://sfc-repo.snowflakecomputing.com/odbc/linux/${VER}/snowflake-odbc-${VER}.x86_64.deb"
          if ! sudo dpkg --install snowflake-odbc.deb; then
            sudo apt-get install --fix-broken --yes
          fi

          # Snowflake's driver may default to libodbcinst.so.1, while the
          # Ubuntu runner provides libodbcinst.so.2. Point the driver at the
          # installed unixODBC library explicitly.
          ODBCINST_LIB="$(ldconfig -p | awk '/libodbcinst\.so\.2 / {print $NF; exit}')"
          if [ -z "${ODBCINST_LIB}" ]; then
            ODBCINST_LIB="$(find /usr/lib /usr/lib64 /lib -name 'libodbcinst.so.2' -print -quit 2>/dev/null || true)"
          fi
          test -n "${ODBCINST_LIB}"

          SNOWFLAKE_INI="$(find /usr/lib/snowflake /usr/lib64/snowflake -name 'simba.snowflake.ini' -print -quit 2>/dev/null || true)"
          test -n "${SNOWFLAKE_INI}"
          if grep -qE '^[[:space:]]*ODBCInstLib=' "${SNOWFLAKE_INI}"; then
            sudo sed -i -E "s|^[[:space:]]*ODBCInstLib=.*$|ODBCInstLib=${ODBCINST_LIB}|" "${SNOWFLAKE_INI}"
          else
            echo "ODBCInstLib=${ODBCINST_LIB}" | sudo tee -a "${SNOWFLAKE_INI}" >/dev/null
          fi
          grep -n '^ODBCInstLib=' "${SNOWFLAKE_INI}"

          echo "Registered ODBC drivers:"
          odbcinst -q -d
          if ! odbcinst -q -d | grep -q 'SnowflakeDSIIDriver'; then
            echo "SnowflakeDSIIDriver was not registered"
            exit 1
          fi

          find /usr/lib /usr/lib64 -name 'libSnowflake.so' -print 2>/dev/null || true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check

      - name: Run tests with source
        run: |
          td <- file.path(tempdir(), "mockDatasets")
          dir.create(td)
          Sys.setenv(OMOP_DATA_FOLDER = td)
          omock::downloadMockDataset(datasetName = "GiBleed")
          print(odbc::odbcListDrivers())
          source(here::here("extras", "cleanDbms.R"))
          x <- devtools::test()
          error <- sum(as.numeric(dplyr::as_tibble(x)$error))
          failed <- sum(as.numeric(dplyr::as_tibble(x)$failed))
          source(here::here("extras", "cleanDbms.R"))
          if (error + failed > 0) cli::cli_abort(c(x = "Tests failed"))
        shell: Rscript {0}
